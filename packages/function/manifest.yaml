version: 1.0.3
name: Card top up 
description: Card top up
inputs:
  - sourceChain: uint32
  - sourceToken: address
  - destinationChain: uint32
  - destinationToken: address
  - thresholdAmount: string        # e.g., '10.5' = 10.5 USDC
  - targetAmount: string
  - recipient: address
  - maxFee: string          # e.g., '0.01' = 0.01 USDC
  - slippage: uint16   # e.g., 50 = 0.50%

abis: 
  - ERC20: './abis/ERC20.json'  